<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E1236"/><stop offset=".55" stop-color="#432878"/><stop offset="1" stop-color="#8A4CA3"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".65"><stop offset="0" stop-color="#FF9BB0" stop-opacity=".7"/><stop offset="1" stop-color="#FF9BB0" stop-opacity="0"/></radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7D8F1"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26173F"/><stop offset="1" stop-color="#3E2569"/></linearGradient>
    <radialGradient id="eye" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFE6D4"/><stop offset=".55" stop-color="#FF9C8E"/><stop offset="1" stop-color="#E8507F"/></radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB08E"/><stop offset="1" stop-color="#EC5B85"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <ellipse cx="256" cy="424" rx="118" ry="16" fill="#000" opacity=".25" filter="url(#soft)"/>
  <!-- corps de chouette : tête ronde, aigrettes en plume vers l'extérieur -->
  <path d="M256 128 C306 128 342 140 362 160 L404 112 C406 150 398 182 384 204 C392 224 394 246 394 270 C394 356 336 410 256 410 C176 410 118 356 118 270 C118 246 120 224 128 204 C114 182 106 150 108 112 L150 160 C170 140 206 128 256 128 Z" fill="url(#head)"/>
  <!-- masque facial : deux disques -->
  <circle cx="205" cy="246" r="62" fill="url(#visor)"/>
  <circle cx="307" cy="246" r="62" fill="url(#visor)"/>
  <!-- yeux lumineux -->
  <circle cx="205" cy="246" r="44" fill="#FF8FA8" opacity=".5" filter="url(#soft)"/>
  <circle cx="307" cy="246" r="44" fill="#FF8FA8" opacity=".5" filter="url(#soft)"/>
  <circle cx="205" cy="246" r="33" fill="url(#eye)"/>
  <circle cx="307" cy="246" r="33" fill="url(#eye)"/>
  <circle cx="194" cy="234" r="9" fill="#fff" opacity=".92"/>
  <circle cx="296" cy="234" r="9" fill="#fff" opacity=".92"/>
  <!-- bec -->
  <path d="M238 300 Q256 290 274 300 L262 334 Q256 344 250 334 Z" fill="url(#beak)"/>
  <!-- plumes de poitrine -->
  <path d="M214 362 q14 10 28 0 M242 368 q14 10 28 0 M270 362 q14 10 28 0" fill="none" stroke="#D6C2E6" stroke-width="7" stroke-linecap="round"/>
</svg>
